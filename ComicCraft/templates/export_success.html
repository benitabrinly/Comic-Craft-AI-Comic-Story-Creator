<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF ready | ComicCraft</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <h1 class="logo small">ComicCraft</h1>
    <div class="card center">
      <h2 class="story-title">Your comic is saved</h2>
      <p>The PDF <strong>{{ pdf_filename }}</strong> is ready. If the download did not start, use the button below.</p>
      <div class="actions">
        <a id="dl" class="btn" href="/static/exports/{{ pdf_filename }}" download>Download PDF again</a>
        <a class="btn ghost" href="/">Make another comic</a>
      </div>
    </div>
  </main>
  <script>setTimeout(function () { document.getElementById("dl").click(); }, 500);</script>
</body>
</html>
